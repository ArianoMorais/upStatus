services:
  mongo:
    image: mongo:7
    container_name: upstatus-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: upstatus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upstatus-api
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    ports:
      - "5000:8080"
    env_file:
      - ./backend/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: mongodb://mongo:27017
      Redis__ConnectionString: redis:6379

volumes:
  mongo_data:
  redis_data:
